name: Secret Scan

# SOC-2 CC6/CC7 — prevent credentials from being (re)introduced to the repo.
# Runs gitleaks over the full history on PRs, pushes to the default branch,
# and on demand. Fails the build on any finding. Same workflow and job name
# (`gitleaks`) as the product repos, so the org required-check ruleset can
# target it here too (LetMeDoit-org/.github#37).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2 # bump as needed
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository and history
        # --redact keeps secret values out of the logs; --exit-code 1 fails the job on findings.
        run: gitleaks detect --source . --redact --verbose --exit-code 1
