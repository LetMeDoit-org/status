#
# Maintained by hand in this repository (change it through a pull request).
# Generated from the Upptime template, then changed so that `main` can stay fully
# protected: Upptime's own pushes are kept on the runner and its commits are
# published as signed commits by the Upptime GitHub App
# (.github/scripts/push-signed-commits.sh). Upptime's update-template command
# would overwrite these changes, so it is not run here; upgrade the
# uptime-monitor version in a pull request instead.
#
# 🔼 Upptime @v1.46.1
# GitHub-powered open-source uptime monitor and status page by Anand Chowdhary

# * Source: https://github.com/upptime/upptime
# * Docs and more: https://upptime.js.org
# * More by Anand Chowdhary: https://anandchowdhary.com


name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Generate graphs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only workflows running on main can read the App key (environment branch policy).
    environment:
      name: upptime
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Keep Upptime pushes local
        shell: bash
        run: |
          git init --quiet --bare "$RUNNER_TEMP/upptime-push.git"
          git remote set-url --push origin "$RUNNER_TEMP/upptime-push.git"
          git config remote.origin.push "+HEAD:refs/heads/upptime"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Setup Node.js for graphs
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Generate graphs
        uses: upptime/uptime-monitor@v1.46.1
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ github.token }}
      - name: Create Upptime App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish signed commits
        shell: bash
        run: .github/scripts/push-signed-commits.sh
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
