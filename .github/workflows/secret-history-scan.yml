name: Secret History Scan

# SOC-2 CC6.1 / CC7.1 - nightly full-history secret scan with TruffleHog.
# Complements secret-scan.yml (gitleaks): TruffleHog walks every commit on every
# branch and checks each candidate against the issuing service, so it reports
# credentials that still WORK, not just strings that look secret.
# The logic lives in the org reusable workflow (LetMeDoit-org/.github#6).
# Findings: redacted JSON artifact (90 days) + a `security` issue on verified hits.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/secret-history-scan.yml

permissions:
  contents: read
  issues: write

jobs:
  trufflehog:
    uses: LetMeDoit-org/.github/.github/workflows/secret-history-scan.yml@main
