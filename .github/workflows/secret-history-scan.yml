name: Secret History Scan

# SOC-2 CC6.1 / CC7.1 - nightly full-history secret scan with TruffleHog.
# Complements secret-scan.yml (gitleaks): TruffleHog walks every commit on every
# branch and checks each candidate against the issuing service, so it reports
# credentials that still WORK, not just strings that look secret.
#
# This repo is public, and a public repo cannot call the org reusable workflow in
# the internal LetMeDoit-org/.github repo, so the same steps are inlined here
# (keep in sync with .github/workflows/secret-history-scan.yml in that repo).
# The trufflesecurity/trufflehog action is not used: it prints findings, secret
# values included, to the job log, and logs of a public repo are public. Here the
# raw output only ever goes to a file that is reduced to metadata and deleted.
#
# Findings: redacted JSON artifact (90 days) + a `security` issue on verified hits.
# pull_request runs (only when this file changes) report but never fail or open issues.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/secret-history-scan.yml

permissions:
  contents: read

jobs:
  trufflehog:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      TRUFFLEHOG_VERSION: 3.97.5
      ISSUE_TITLE: 'Secret history scan: verified live credentials found'
    steps:
      - name: Checkout full history (all branches)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Install TruffleHog (pinned + sha256 verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          tarball="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          sums="trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/${sums}"
          # Fail closed: the tarball's line must exist in the checksums file and match.
          grep -E "  ${tarball}\$" "${sums}" > expected.sha256
          if [ "$(wc -l < expected.sha256)" -ne 1 ]; then
            echo "::error::Checksum entry for ${tarball} not found in ${sums}"
            exit 1
          fi
          sha256sum --check --strict expected.sha256
          tar -xzf "${tarball}" trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Scan full git history (verified only)
        run: |
          set -uo pipefail
          # Findings must never abort the job before redaction; keep the exit code only
          # to detect a scanner crash. stdout (secret values) goes to raw.jsonl only.
          rc=0
          trufflehog git file://. --results=verified --json --no-update \
            > "$RUNNER_TEMP/raw.jsonl" || rc=$?
          echo "trufflehog exit code: ${rc}"
          echo "TRUFFLEHOG_RC=${rc}" >> "$GITHUB_ENV"

      - name: Redact findings
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/raw.jsonl"
          touch "$raw"
          # Keep metadata only. Raw, RawV2, Redacted and ExtraData are dropped here.
          jq -c 'select(type == "object" and has("DetectorName") and .Verified == true) | {
              detector: .DetectorName,
              file: (.SourceMetadata.Data.Git.file // ""),
              commit: ((.SourceMetadata.Data.Git.commit // "")[0:12]),
              line: (.SourceMetadata.Data.Git.line // null),
              timestamp: (.SourceMetadata.Data.Git.timestamp // "")
            }' "$raw" > report.jsonl
          rm -f "$raw"
          verified="$(jq -s 'length' report.jsonl)"
          echo "VERIFIED=${verified}" >> "$GITHUB_ENV"
          # Markdown table of verified findings (metadata only). Pipes in paths escaped.
          {
            echo '| Detector | File | Commit | Line |'
            echo '| --- | --- | --- | --- |'
            jq -r '"| \(.detector) | `\(.file | gsub("\\|"; "\\|"))` | `\(.commit)` | \(.line // "") |"' report.jsonl
          } > verified-table.md

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Secret history scan (TruffleHog)'
            echo
            echo "- Verified (live) credentials: **${VERIFIED:-n/a}**"
            echo "- Scanner exit code: ${TRUFFLEHOG_RC:-n/a}"
            echo
            if [ "${VERIFIED:-0}" != "0" ] && [ -f verified-table.md ]; then
              echo '### Verified findings'
              echo
              cat verified-table.md
            else
              echo 'No verified findings.'
            fi
            echo
            echo "_Values are never shown. Full redacted report: \`secret-history-report\` artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-history-report
          path: report.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Open or update security issue
        if: env.VERIFIED != '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "TruffleHog found **${VERIFIED}** verified live credential(s) in this repository's git history."
            echo
            cat verified-table.md
            echo
            echo "Rotate each credential at its provider (see SECRETS_RUNBOOK.md in LetMeDoit-org/.github), then re-run this workflow; verified findings disappear once the credential is revoked."
            echo
            echo "Run: ${RUN_URL}"
          } > issue-body.md
          existing="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title --limit 50 \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
            echo "Commented on existing issue #${existing}"
          else
            if ! gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md \
                --label security --label P0-critical; then
              echo "::warning::Labels missing in this repo; creating the issue without labels."
              gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
            fi
          fi

      - name: Fail on verified findings
        if: env.VERIFIED != '0' && github.event_name != 'pull_request'
        run: |
          echo "::error::${VERIFIED} verified live credential(s) found. Rotate them, then re-run."
          exit 1

      - name: Fail on scanner error
        if: env.TRUFFLEHOG_RC != '0' && env.TRUFFLEHOG_RC != '183'
        run: |
          echo "::error::TruffleHog exited with code ${TRUFFLEHOG_RC}; the scan may be incomplete."
          exit 1
